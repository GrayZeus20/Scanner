name: Deploy WebScanner

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || true

      - name: Deploy to Belmo/Cloudflare
        uses: belmo-cli/deploy@main
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          worker-name: scanner-ai-proxy
