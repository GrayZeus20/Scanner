<!DOCTYPE html>
<html lang="id" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WebScanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" async></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <div class="logo">
          <i data-lucide="scan-eye" class="logo-icon" aria-hidden="true"></i>
          <span class="logo-text" data-i18n="appName">WebScanner</span>
        </div>
      </div>
        <div class="header-right">
          <label for="langSwitcher" class="visually-hidden">Language</label>
          <select id="langSwitcher" class="lang-select">
            <option value="id">ID Indonesia</option>
            <option value="en">Eng English</option>
          </select>
          <button id="darkToggle" class="icon-btn" title="Toggle Dark Mode">
            <i data-lucide="moon"></i>
          </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main">
      <!-- History View -->
      <div id="historyView" class="hidden">
        <div class="history-header">
          <h3 data-i18n="history">Riwayat Scan</h3>
          <button id="closeHistory" class="icon-btn" aria-label="Close History"><i data-lucide="x" aria-hidden="true"></i></button>
        </div>
        <div id="historyList" class="history-list"></div>
      </div>

      <!-- Preview Area -->
      <div id="previewArea">
        <div id="emptyState">
          <i data-lucide="scan-eye" class="empty-icon" aria-hidden="true"></i>
          <h2 data-i18n="emptyTitle">Belum ada dokumen</h2>
          <p data-i18n="emptyDesc">Ambil foto atau impor gambar untuk memulai</p>
          <div class="empty-actions">
            <button id="emptyCamera" class="btn btn-primary">
              <i data-lucide="camera" aria-hidden="true"></i>
              <span data-i18n="takePhoto">Ambil Foto</span>
            </button>
            <button id="emptyImport" class="btn btn-secondary">
              <i data-lucide="upload" aria-hidden="true"></i>
              <span data-i18n="importFile">Impor File</span>
            </button>
          </div>
        </div>
        <div id="editorArea" class="hidden">
          <div class="pages-tray" id="pagesTray"></div>
          <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mainCanvas" aria-label="Document Canvas"></canvas>
            <!-- Manual Crop Overlay (CamScanner-style) -->
            <div id="cropOverlay" class="crop-overlay hidden">
              <div id="cropArea" class="crop-area">
                <div class="crop-grid" aria-hidden="true"></div>
                <div class="crop-handle" data-handle="tl" aria-label="Resize Top Left"></div>
                <div class="crop-handle" data-handle="tr" aria-label="Resize Top Right"></div>
                <div class="crop-handle" data-handle="bl" aria-label="Resize Bottom Left"></div>
                <div class="crop-handle" data-handle="br" aria-label="Resize Bottom Right"></div>
                <div class="crop-magnifier" id="cropMagnifier" aria-hidden="true"></div>
              </div>
            </div>
            <!-- Crop Action Bar -->
            <!-- Inpaint Overlay (AI Object Removal) -->
            <div id="inpaintOverlay" class="inpaint-overlay hidden">
              <canvas id="maskCanvas" class="mask-canvas"></canvas>
            </div>
            <!-- Inpaint Action Bar -->
            <div id="inpaintActionBar" class="crop-action-bar hidden">
              <div class="inpaint-toolbar">
                <label for="brushSizeSlider" data-i18n="brushSize">Ukuran Kuas</label>
                <input type="range" id="brushSizeSlider" min="10" max="100" value="30">
                <span id="brushSizeVal" class="filter-val">30</span>
              </div>
              <button id="cancelInpaintBtn" class="crop-action-btn crop-cancel" aria-label="Cancel">
                <i data-lucide="x" aria-hidden="true"></i>
              </button>
              <button id="confirmInpaintBtn" class="crop-action-btn crop-confirm" aria-label="Confirm">
                <i data-lucide="check" aria-hidden="true"></i>
              </button>
            </div>
            <div id="inpaintProgress" class="inpaint-progress-bar hidden">
              <i data-lucide="loader" class="spinner" aria-hidden="true"></i>
              <span data-i18n="removeStarting">AI sedang menghapus...</span>
            </div>

            <div id="cropActionBar" class="crop-action-bar hidden">
              <button id="cancelCropBtn" class="crop-action-btn crop-cancel" aria-label="Cancel">
                <i data-lucide="x" aria-hidden="true"></i>
              </button>
              <button id="confirmCropBtn" class="crop-action-btn crop-confirm" aria-label="Confirm">
                <i data-lucide="check" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <!-- Zoom Controls -->
          <div id="zoomControls" class="zoom-controls">
            <button id="zoomInBtn" class="zoom-btn" title="Zoom In">
              <i data-lucide="plus"></i>
            </button>
            <button id="zoomResetBtn" class="zoom-btn" title="Reset Zoom">
              <i data-lucide="maximize"></i>
            </button>
            <button id="zoomOutBtn" class="zoom-btn" title="Zoom Out">
              <i data-lucide="minus"></i>
            </button>
          </div>
        </div>
      </div>


      <!-- Camera View -->
      <div id="cameraView" class="hidden">
        <div id="cameraFlash" class="camera-flash" aria-hidden="true"></div>
        <video id="video" autoplay playsinline></video>
        <div class="camera-top-bar">
          <button id="flashToggle" class="flash-btn hidden" aria-label="Toggle Flash">
            <i data-lucide="zap-off" aria-hidden="true"></i>
          </button>
          <button id="cameraToggle" class="camera-switch-btn" aria-label="Switch Camera">
            <i data-lucide="switch-camera" aria-hidden="true"></i>
          </button>
        </div>
        <div class="camera-overlay">
          <div class="frame-guide" aria-hidden="true"></div>
          <div id="focusIndicator" class="focus-indicator hidden" aria-hidden="true"></div>
        </div>
        <div class="camera-controls">
          <button id="cancelCamera" class="camera-action-btn danger-btn" aria-label="Cancel Capture">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
          <button id="captureBtn" class="capture-btn" aria-label="Capture Photo">
            <i data-lucide="circle" aria-hidden="true"></i>
          </button>
          <button id="finishCamera" class="camera-action-btn success-btn" aria-label="Finish Capture">
            <i data-lucide="check" aria-hidden="true"></i>
            <span id="captureCounter" class="capture-counter hidden">0</span>
          </button>
        </div>
        <div id="capturePreview" class="capture-preview hidden">
          <img id="capturePreviewImg" src="" alt="Last captured">
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav id="bottomNav" class="hidden" role="navigation" aria-label="Main Navigation">
        <button id="navHistory" class="nav-btn" role="tab" aria-selected="false">
          <i data-lucide="history" aria-hidden="true"></i>
          <span data-i18n="history">Riwayat</span>
        </button>
        <button id="navCamera" class="nav-btn" role="tab" aria-selected="false">
          <i data-lucide="camera" aria-hidden="true"></i>
          <span data-i18n="takePhoto">Ambil Foto</span>
        </button>
        <button id="navImport" class="nav-btn" role="tab" aria-selected="false">
          <i data-lucide="upload" aria-hidden="true"></i>
          <span data-i18n="importFile">Impor File</span>
        </button>
        <button id="navTools" class="nav-btn" role="tab" aria-selected="false">
          <i data-lucide="settings-2" aria-hidden="true"></i>
          <span data-i18n="tools">Alat</span>
        </button>
        <button id="navExport" class="nav-btn" role="tab" aria-selected="false">
          <i data-lucide="download" aria-hidden="true"></i>
          <span data-i18n="export">Simpan</span>
        </button>
      </nav>
    </main>

    <!-- Tools Sheet Panel -->
    <div id="toolsSheet" class="sheet-panel hidden" role="dialog" aria-modal="true" aria-label="Tools" inert>
      <div class="sheet-header">
        <h3 data-i18n="tools">Alat</h3>
        <button id="closeToolsSheet" class="icon-btn" data-i18n-aria="close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="sheet-body">
        <button id="toolCropBtn" class="tool-action-btn">
          <i data-lucide="crop" aria-hidden="true"></i>
          <div>
            <strong data-i18n="autoCrop">Potong</strong>
            <small data-i18n="cropDesc">Pilih area potong secara manual</small>
          </div>
        </button>
        <button id="toolFilterBtn" class="tool-action-btn">
          <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
          <div>
            <strong data-i18n="filters">Filter</strong>
            <small data-i18n="filterDesc">Atur kecerahan, kontras, dll</small>
          </div>
        </button>
        <button id="toolOcrBtn" class="tool-action-btn">
          <i data-lucide="type" aria-hidden="true"></i>
          <div>
            <strong data-i18n="ocr">Teks (OCR)</strong>
            <small data-i18n="ocrDesc">Ekstrak teks dari gambar</small>
          </div>
        </button>
        <button id="toolInpaintBtn" class="tool-action-btn">
          <i data-lucide="eraser" aria-hidden="true"></i>
          <div>
            <strong data-i18n="removeObj">Hapus Objek</strong>
            <small data-i18n="removeObjDesc">Hapus objek dengan AI</small>
          </div>
        </button>
      </div>
    </div>

    <!-- Filter Sheet Panel -->
    <div id="filterSheet" class="sheet-panel hidden" role="dialog" aria-modal="true" aria-label="Filters">
      <div class="sheet-header">
        <h3 data-i18n="filters">Filter</h3>
        <button id="closeFilterSheet" class="icon-btn" data-i18n-aria="close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="sheet-body">
        <div class="filter-group">
          <label for="filterBrightness" data-i18n="brightness">Kecerahan</label>
          <input type="range" id="filterBrightness" min="-100" max="100" value="0" class="filter-slider">
          <span id="brightnessVal" class="filter-val">0</span>
        </div>
        <div class="filter-group">
          <label for="filterContrast" data-i18n="contrast">Kontras</label>
          <input type="range" id="filterContrast" min="-100" max="100" value="0" class="filter-slider">
          <span id="contrastVal" class="filter-val">0</span>
        </div>
        <div class="filter-group">
          <label for="filterSaturation" data-i18n="saturation">Saturasi</label>
          <input type="range" id="filterSaturation" min="-100" max="100" value="0" class="filter-slider">
          <span id="saturationVal" class="filter-val">0</span>
        </div>
        <div class="filter-group">
          <label for="filterSharpness" data-i18n="sharpness">Ketajaman</label>
          <input type="range" id="filterSharpness" min="0" max="100" value="0" class="filter-slider">
          <span id="sharpnessVal" class="filter-val">0</span>
        </div>
        <div class="filter-divider"></div>
        <div class="filter-group toggle-group">
          <label for="filterGrayscale" data-i18n="grayscale">Abu-abu</label>
          <label class="toggle">
            <input type="checkbox" id="filterGrayscale">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="filter-group toggle-group">
          <label for="filterSepia" data-i18n="sepia">Sepia</label>
          <label class="toggle">
            <input type="checkbox" id="filterSepia">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="filter-group toggle-group">
          <label for="filterInvert" data-i18n="invert">Invert</label>
          <label class="toggle">
            <input type="checkbox" id="filterInvert">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="filter-group toggle-group">
          <label for="filterBW" data-i18n="bwThreshold">Hitam Putih</label>
          <label class="toggle">
            <input type="checkbox" id="filterBW">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="filter-group hidden" id="thresholdGroup">
          <label for="filterThreshold" data-i18n="threshold">Ambang Batas</label>
          <input type="range" id="filterThreshold" min="1" max="254" value="128" class="filter-slider">
          <span id="thresholdVal" class="filter-val">128</span>
        </div>
        <div class="filter-divider"></div>
        <div class="filter-row">
        <button id="rotateLeftBtn" class="filter-action-btn" aria-label="Rotate Left">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            <span data-i18n="rotateLeft">Putar Kiri</span>
          </button>
          <button id="rotateRightBtn" class="filter-action-btn" aria-label="Rotate Right">
            <i data-lucide="rotate-cw" aria-hidden="true"></i>
            <span data-i18n="rotateRight">Putar Kanan</span>
          </button>
          <button id="flipHBtn" class="filter-action-btn" aria-label="Flip Horizontal">
            <i data-lucide="flip-horizontal" aria-hidden="true"></i>
            <span data-i18n="flipH">Balik H</span>
          </button>
          <button id="flipVBtn" class="filter-action-btn" aria-label="Flip Vertical">
            <i data-lucide="flip-vertical" aria-hidden="true"></i>
            <span data-i18n="flipV">Balik V</span>
          </button>
        </div>
        <div class="filter-divider"></div>
        <button id="resetFilterBtn" class="btn btn-danger">
          <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          <span data-i18n="resetFilter">Reset Filter</span>
        </button>
      </div>
    </div>

    <!-- Settings Sheet -->
    <!-- AI is now pre-configured with built-in API key. No user settings needed. -->

    <!-- OCR Sheet Panel -->
    <div id="ocrSheet" class="sheet-panel hidden" role="dialog" aria-modal="true" aria-label="OCR">
      <div class="sheet-header">
        <h3 data-i18n="ocr">Teks (OCR)</h3>
        <button id="closeOcrSheet" class="icon-btn" data-i18n-aria="close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="sheet-body">
        <div id="ocrProgress" class="ocr-progress hidden">
          <div class="ocr-progress-bar"><div id="ocrProgressBar" class="ocr-progress-fill"></div></div>
          <span id="ocrProgressText" class="ocr-progress-text">0%</span>
        </div>
        <div id="ocrResult" class="ocr-result" contenteditable="true" aria-label="OCR Result">
          <p style="color: var(--color-text-secondary)"><i data-lucide="loader" aria-hidden="true"></i> <span data-i18n="processing">Memproses...</span></p>
        </div>
        <button id="copyOcrBtn" class="btn btn-primary">
          <i data-lucide="copy" aria-hidden="true"></i>
          <span data-i18n="copyText">Salin Teks</span>
        </button>
        <button id="aiAnalyzeBtn" class="btn btn-secondary">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          <span data-i18n="aiAnalyze">Analisis AI</span>
        </button>
        <button id="cancelOcrBtn" class="btn btn-danger hidden">
          <i data-lucide="x" aria-hidden="true"></i>
          <span data-i18n="cancel">Batal</span>
        </button>
        <div id="aiResultArea" class="ocr-result hidden"></div>
      </div>
    </div>

    <!-- Export Sheet Panel -->
    <div id="exportSheet" class="sheet-panel hidden" role="dialog" aria-modal="true" aria-label="Export">
      <div class="sheet-header">
        <h3 data-i18n="export">Simpan</h3>
        <button id="closeExportSheet" class="icon-btn" data-i18n-aria="close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="sheet-body">
        <button class="export-btn" data-format="pdf">
          <i data-lucide="file-text" aria-hidden="true"></i>
          <div>
            <strong data-i18n="exportPdf">PDF</strong>
            <small data-i18n="exportPdfDesc">Simpan sebagai dokumen PDF</small>
          </div>
        </button>
        <button class="export-btn" data-format="png">
          <i data-lucide="image" aria-hidden="true"></i>
          <div>
            <strong data-i18n="exportPng">PNG</strong>
            <small data-i18n="exportPngDesc">Gambar berkualitas tinggi</small>
          </div>
        </button>
        <button class="export-btn" data-format="jpg">
          <i data-lucide="image" aria-hidden="true"></i>
          <div>
            <strong data-i18n="exportJpg">JPG</strong>
            <small data-i18n="exportJpgDesc">Ukuran file lebih kecil</small>
          </div>
        </button>
      </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
  </div>

  <script src="js/config.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/edge-detection.js"></script>
  <script src="js/manual-crop.js"></script>
  <script src="js/pdf-export.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/inpaint.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
